<!DOCTYPE html>

<body>

<h2>JavaScript For Loop</h2>

<p id="demo"></p>
<p id="demo1"></p>
<p id="demo2"></p>
<p id="test1"></p>

<script>
    var num = "";
    
    for (var i = 2; i < 27; i+=3) { // change to a different number
        num += "The number is " + i + "<br>";
       
    }
    document.getElementById("demo").innerHTML = num;
    
    var num_brk = "";
    
    for (var z = 2; z < 99; z+=2) {
        if(z===24) {break;}
        num_brk += "The number is " + z + " lets loop again" + "<br>";
    }
    document.getElementById("demo1").innerHTML = num_brk;
    
    
    var cars = ["Tesla", "Volvo", "BMW", "Ford", "Fiat", "Audi"];
    
    var carnames = "";
    
    for (var j = 0; j < cars.length; j++) {
        carnames += cars[j] + "<br>";
    }
    document.getElementById("demo2").innerHTML = carnames;
    
    var test = "";
    
    for (var t = 8; t < 28; t+=2) {
        test += t + "<br>";
    }
    document.getElementById("test1").innerHTML = test;

</script>
