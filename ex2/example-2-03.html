<!DOCTYPE html>
<html lang="eng">
    <head>
        <title>CSS colors and fonts</title>
        <style>
            h1 {
                font-family: "Lucida Console", Courier, monospace;
                color: #ba45cf;
                text-align: left;
            }
            h2 {
                font-family: Times New Roman, Times, serif;
                font-style: italic;
                text-align: right;
                color: #7e7ecf
            }
            p {
                font-size: 19.2px;
                text-align: center;
                background-color: rgba(236, 84, 175, 0.4);
                color: black;
            }
            .box {
                width: 200px; /* Content area width */
                padding: 20px; /* Space around the content, padding-left to not make it equal on all four sides */
                border: 10px solid #f69edd; /* Border around the padding */
                margin: 30px; /* Space outside the border. this is for all 4 directions */
                background-color: #eeeeee; /* Background of the content and padding areas */
                box-sizing: border-box; /* Ensures width includes padding and border */
                align-content: center; /* alings the content inside the box */
                }
            a {color:#7d0c9c;
            }
    </style>
</head>
<body>
        <h1>This is the main heading</h1>
        <h2>This is a secondary heading</h2>
        <p>This is a centered paragraph.</p>
        <div class="box"> <a href='geo455_ex2.html'>Back to Main Page</a>  </div>
    </body>
</html>
